AWSTemplateFormatVersion: '2010-09-09'
Description: IDP stack

Resources:

  # Configure load balancer for IDP service

  # Need to eventually open up from any client needing to communicate with IDP

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IDP load balancer security group
      VpcId: !ImportValue shared-services-stack-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !ImportValue ansible-controller-stack-SecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic to anywhere
      Tags:
        - Key: Name
          Value: "idp-load-balancer-sg"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: "keycloak-idp-load-balancer"
      IpAddressType: ipv4
      Scheme: internal
      Type: network
      SecurityGroups:
        - !Ref SecurityGroup
      Subnets:
        - !ImportValue shared-services-stack-IngressSubnet1Id
        - !ImportValue shared-services-stack-IngressSubnet2Id

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "keycloak-idp-target-group"
      TargetType: ip
      Port: 8080
      Protocol: TCP
      Targets: []
      HealthCheckEnabled: true
      HealthCheckPort: traffic-port
      HealthCheckProtocol: tcp
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      VpcId: !ImportValue shared-services-stack-VpcId

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Port: 80
      Protocol: TCP
      LoadBalancerArn: !Ref LoadBalancer
      DefaultActions:
        - TargetGroupArn: !Ref TargetGroup
          Type: forward

  # When using Fargate, the container and host ports must be the same.

  # TODO: I think we need a security group for the task or service as well.

  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Cpu: 512
      Memory: 2048
      EnableFaultInjection: false
      ExecutionRoleArn: "arn:aws:iam::${XYZ-account-id}:role/ecs-task-execution-role"
      Family: web
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: httpd
          Image: "docker.io/library/httpd:2.4.68"
          Cpu: 0
          Essential: true
          PortMappings:
            - Name: httpd-80-tcp
              AppProtocol: http
              ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
      Tags:
        - Key: Name
          Value: "httpd-ecs-task-definition"
