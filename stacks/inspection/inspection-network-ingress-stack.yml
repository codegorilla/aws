AWSTemplateFormatVersion: "2010-09-09"
Description: Inspection network ingress stack

Resources:

  InspectionIngressLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Inspection ingress load balancer security group
      GroupName: inspection-ingress-network-load-balancer-sg
      VpcId: !ImportValue inspection-network-stack-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !ImportValue inspection-network-stack-VpcCidr
      Tags:
        - Key: Name
          Value: "inspection-ingress-network-load-balancer-sg"

  InspectionIngressLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: inspection-ingress-nlb
      Scheme: internet-facing
      Type: network
      SecurityGroups:
        - !Ref InspectionIngressLoadBalancerSecurityGroup
      Subnets:
        - !ImportValue inspection-network-stack-PublicSubnet1Id
        - !ImportValue inspection-network-stack-PublicSubnet2Id
      Tags:
        - Key: Name
          Value: "inspection-ingress-network-load-balancer"

  InspectionIngressTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: inspection-ingress-tg
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 10
      HealthCheckPort: 80
      # This should eventually be set to HTTP
      HealthCheckProtocol: TCP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      # Matcher: 
      #   HttpCode: 200
      Port: 80
      Protocol: TCP
      Targets:
        - Id: !ImportValue inspection-proxy-instance-stack-InstanceId
      TargetType: instance
      VpcId: !ImportValue inspection-network-stack-VpcId
      Tags:
        - Key: Name
          Value: "inspection-ingress-target-group"
