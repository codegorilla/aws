AWSTemplateFormatVersion: "2010-09-09"
Description: Inspection network ingress stack

# To get your own IP address, visit https://checkip.amazonaws.com.
# Use that IP with /32 appended for the IngressCidr.

Parameters:
  IngressCidr:
    Type: String
    Description: "The IP address range allowed"
    Default: "10.0.0.0/16"

Resources:

  InspectionIngressLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Inspection ingress load balancer security group
      GroupName: inspection-ingress-network-load-balancer-sg
      VpcId: !ImportValue inspection-network-stack-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref IngressCidr
      Tags:
        - Key: Name
          Value: "inspection-ingress-network-load-balancer-sg"

  # Update the instance security group now that the LB security group
  # is known. This works even when preserving client IP address.

  NewIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow HTTPS from inspection ingress load balancer
      GroupId: !ImportValue inspection-proxy-instance-stack-SecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref InspectionIngressLoadBalancerSecurityGroup

  InspectionIngressLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: inspection-ingress-nlb
      Scheme: internet-facing
      Type: network
      SecurityGroups:
        - !Ref InspectionIngressLoadBalancerSecurityGroup
      Subnets:
        - !ImportValue inspection-network-stack-PublicSubnet1Id
        - !ImportValue inspection-network-stack-PublicSubnet2Id
      Tags:
        - Key: Name
          Value: "inspection-ingress-network-load-balancer"

  InspectionIngressTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: inspection-ingress-tg
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 10
      HealthCheckPort: 80
      # This should eventually be set to HTTP
      HealthCheckProtocol: TCP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      # Matcher: 
      #   HttpCode: 200
      Port: 80
      Protocol: TCP
      Targets:
        - Id: !ImportValue inspection-proxy-instance-stack-InstanceId
      TargetType: instance
      VpcId: !ImportValue inspection-network-stack-VpcId
      Tags:
        - Key: Name
          Value: "inspection-ingress-target-group"

  InspectionIngressListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref InspectionIngressTargetGroup
      LoadBalancerArn: !Ref InspectionIngressLoadBalancer
      Port: 80
      Protocol: TCP
      Tags: 
        - Key: Name
          Value: "inspection-ingress-listener"
