AWSTemplateFormatVersion: '2010-09-09'
Description: Production OCP management server stack

# Unlike SSM Session Manager, EC2 Instance Connect requires port
# tcp/22 to be open on the instance's security group.

# RHEL-9.8.0_HVM-20260908-x86_64-0-Hourly2-GP3

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: "ID of AMI to use for OCP Management server instance"
    Default: ami-0b77fd0a4e70d9ca6

Resources:

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Development EKS Manager security group
      VpcId: !ImportValue prod-network-stack-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !ImportValue prod-network-stack-ManagementInstanceConnectEndpointSecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic to anywhere
      Tags:
        - Key: Name
          Value: "prod-ocp-management-server-sg"

  # # The following IAM policy and role are needed to allow the
  # # "aws eks update-kubeconfig ..." command to complete successfully.

  # ManagedPolicy:
  #   Type: AWS::IAM::ManagedPolicy
  #   Properties:
  #     Description: "Allows describing any EKS cluster within this AWS account"
  #     ManagedPolicyName: prod-ocp-management-server-policy
  #     Path: '/'
  #     PolicyDocument:
  #       Version: '2012-10-17'
  #       Statement:
  #         - Effect: Allow
  #           Action:
  #             - "eks:DescribeCluster"
  #           Resource: !Sub "arn:aws:eks:*:${AWS::AccountId}:cluster/*"

  # Role:
  #   Type: AWS::IAM::Role
  #   Properties:
  #     Description: "Development EKS manager role"
  #     AssumeRolePolicyDocument:
  #       Version: "2012-10-17"
  #       Statement:
  #         - Effect: "Allow"
  #           Principal:
  #             Service:
  #               - "ec2.amazonaws.com"
  #           Action:
  #             - "sts:AssumeRole"
  #     ManagedPolicyArns:
  #       - !Ref ManagedPolicy
  #     RoleName: prod-ocp-management-server-role
  #     Tags:
  #       - Key: "Name"
  #         Value: "prod-ocp-management-server-role"

  # Our understanding is that since we are creating the role in the
  # same CFn template where the instance is defined, we need to
  # explicity create the IAM profile. Perhaps this requirement can be
  # verified in the future.

  # InstanceProfile:
  #   Type: AWS::IAM::InstanceProfile
  #   Properties:
  #     Path: "/"
  #     Roles:
  #       - !Ref Role

  # We should use RHEL 9.8 AMI. Do not associate a public IP
  # in CFn. Instead, do it manually whenever required to avoid costs
  # associated with a public IP.

  # Note: SSM quick setup is probably not required since we are using
  # EC2 Instance Connect instead of SSM Session Manager.

  # Note: Key pair is omitted because we are using EC2 Instance
  # Connect instead of traditional SSH logins.

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.small
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet:
            - !Ref SecurityGroup
          SubnetId: !ImportValue prod-network-stack-ManagementSubnetId
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: 40
      # IamInstanceProfile: !Ref InstanceProfile
      Tags:
        - Key: Name
          Value: "prod-ocp-management-server-instance"

  # ForwardRecord:
