AWSTemplateFormatVersion: '2010-09-09'
Description: Egress network stack

Parameters:
  VpcCidr:
    Type: String
    Description: "CIDR block of VPC"
    Default: 100.64.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ A"
    Default: 100.64.10.0/24
  PublicSubnet2Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ B"
    Default: 100.64.11.0/24
  PublicSubnet3Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ C"
    Default: 100.64.12.0/24
  PrivateSubnet1Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ A"
    Default: 100.64.20.0/24
  PrivateSubnet2Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ B"
    Default: 100.64.21.0/24
  PrivateSubnet3Cidr:
    Type: String
    Description: "CIDR block of public subnet in AZ C"
    Default: 100.64.22.0/24
  TgwSubnet1Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ A"
    Default: 100.64.30.0/24
  TgwSubnet2Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ B"
    Default: 100.64.31.0/24
  TgwSubnet3Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ C"
    Default: 100.64.32.0/24

Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: "egress-vpc"

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-public-subnet-a"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-public-subnet-b"

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}c"
      CidrBlock: !Ref PublicSubnet3Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-public-subnet-c"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-private-subnet-a"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-private-subnet-b"

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}c"
      CidrBlock: !Ref PrivateSubnet3Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-private-subnet-c"

  TgwSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref TgwSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-subnet-a"

  TgwSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref TgwSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-subnet-b"

  TgwSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}c"
      CidrBlock: !Ref TgwSubnet3Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-subnet-c"

  # Create custom route tables and explicitly associate subnets to
  # override the default route table.

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-public-rtb"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-private-rtb"

  # We need separate route tables to allow individualized routes
  # tailored to separate NAT gateways in each AZ.

  TgwRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-rtb-a"

  TgwRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-rtb-b"

  TgwRouteTable3:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-tgw-rtb-c"

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  TgwSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet1
      RouteTableId: !Ref TgwRouteTable1

  TgwSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet2
      RouteTableId: !Ref TgwRouteTable2

  TgwSubnet3Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet3
      RouteTableId: !Ref TgwRouteTable3

  InstanceConnectEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress instance connect endpoint security group
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref VpcCidr
          Description: Allow SSH to hosts within VPC
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "egress-instance-connect-endpoint-sg"

  InstanceConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      PreserveClientIp: false
      SecurityGroupIds:
        - !Ref InstanceConnectEndpointSecurityGroup
      SubnetId: !Ref PrivateSubnet1
      Tags:
        - Key: Name
          Value: egress-eice

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "egress-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

Outputs:

  VpcId:
    Description: "The ID of the VPC"
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnet1Id:
    Description: "The ID of the public subnet in AZ A"
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Description: "The ID of the public subnet in AZ B"
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"

  PublicSubnet3Id:
    Description: "The ID of the public subnet in AZ C"
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet3Id"

  PrivateSubnet1Id:
    Description: "The ID of the private subnet in AZ A"
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Description: "The ID of the private subnet in AZ B"
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  PrivateSubnet3Id:
    Description: "The ID of the private subnet in AZ C"
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet3Id"

  TgwSubnet1Id:
    Description: "The ID of the TGW subnet in AZ A"
    Value: !Ref TgwSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet1Id"

  TgwSubnet2Id:
    Description: "The ID of the TGW subnet in AZ B"
    Value: !Ref TgwSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet2Id"

  TgwSubnet3Id:
    Description: "The ID of the TGW subnet in AZ C"
    Value: !Ref TgwSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet3Id"

  VpcCidr:
    Description: "CIDR block of VPC"
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"

  PublicRouteTableId:
    Description: "The ID of the public route table"
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub "${AWS::StackName}-PublicRouteTableId"

  TgwRouteTable1Id:
    Description: "The ID of TGW route table 1"
    Value: !Ref TgwRouteTable1
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTable1Id"

  TgwRouteTable2Id:
    Description: "The ID of TGW route table 2"
    Value: !Ref TgwRouteTable2
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTable2Id"

  TgwRouteTable3Id:
    Description: "The ID of TGW route table 3"
    Value: !Ref TgwRouteTable3
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTable3Id"

  InstanceConnectEndpointSecurityGroupId:
    Description: "ID of instance connect endpoint security group"
    Value: !Ref InstanceConnectEndpointSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-InstanceConnectEndpointSecurityGroupId"
