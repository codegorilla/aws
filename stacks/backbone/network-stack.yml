AWSTemplateFormatVersion: "2010-09-09"
Description: Backbone network stack

Resources:

  # Disabling default route table association and propagation
  # prevents automatic creation of a default transit gateway route
  # table. We want to create the transit gateway route table
  # ourselves because it allows more control over network
  # segmentation and makes the transit gateway route table ID
  # explicitly known.

  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: Backbone network transit gateway
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      Tags:
        - Key: Name
          Value: backbone-network-tgw

  # This gets associated with the egress VPC TGWA

  EgressTransitGatewayRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway
      Tags:
        - Key: Name
          Value: backbone-network-egress-tgw-rtb

  # This gets associated with all spoke VPC TGWAs

  SpokeTransitGatewayRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway
      Tags:
        - Key: Name
          Value: backbone-network-spoke-tgw-rtb

Outputs:

  TransitGatewayId:
    Description: "The ID of the backbone network transit gateway"
    Value: !Ref TransitGateway
    Export:
      Name: !Sub "${AWS::StackName}-TransitGatewayId"

  EgressTransitGatewayRouteTableId:
    Description: "The ID of the backbone network egress transit gateway route table"
    Value: !Ref EgressTransitGatewayRouteTable
    Export:
      Name: !Sub "${AWS::StackName}-EgressTransitGatewayRouteTableId"

  SpokeTransitGatewayRouteTableId:
    Description: "The ID of the backbone network spoke transit gateway route table"
    Value: !Ref SpokeTransitGatewayRouteTable
    Export:
      Name: !Sub "${AWS::StackName}-SpokeTransitGatewayRouteTableId"
