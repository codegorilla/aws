AWSTemplateFormatVersion: '2010-09-09'
Description: Inspection (firewall) stack

Parameters:
  VpcCidr:
    Type: String
    Description: "CIDR block of VPC"
    Default: 10.0.0.0/24
  IngressSubnet1Cidr:
    Type: String
    Description: "CIDR block of ingress subnet in AZ A"
    Default: 10.0.10.0/24
  IngressSubnet2Cidr:
    Type: String
    Description: "CIDR block of ingress subnet in AZ B"
    Default: 10.0.11.0/24
  ProxySubnet1Cidr:
    Type: String
    Description: "CIDR block of proxy subnet in AZ A"
    Default: 10.0.20.0/24
  ProxySubnet2Cidr:
    Type: String
    Description: "CIDR block of proxy subnet in AZ B"
    Default: 10.0.21.0/24
  TgwSubnet1Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ A"
    Default: 10.0.30.0/24
  TgwSubnet2Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ B"
    Default: 10.0.31.0/24

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: "inspection-vpc"

  # The ingress subnet is for NLB to NGINX if desired. However, to
  # reduce cost, we can make proxy subnets public instead.

  IngressSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref IngressSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-ingress-subnet-a"

  IngressSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref IngressSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-ingress-subnet-b"

  # To reduce cost, we will make the proxy subnets public.

  ProxySubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref ProxySubnet1Cidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-proxy-subnet-a"

  ProxySubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref ProxySubnet2Cidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-proxy-subnet-b"

  TgwSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref TgwSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-tgw-subnet-a"

  TgwSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref TgwSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-tgw-subnet-b"

  # Create custom route tables and explicitly associate subnets to
  # override the default route table.

  IngressRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-ingress-rtb"

  ProxyRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-proxy-rtb"

  TgwRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "inspection-tgw-rtb"

  IngressSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IngressSubnet1
      RouteTableId: !Ref IngressRouteTable

  IngressSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IngressSubnet2
      RouteTableId: !Ref IngressRouteTable

  ProxySubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnet1
      RouteTableId: !Ref ProxyRouteTable

  ProxySubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProxySubnet2
      RouteTableId: !Ref ProxyRouteTable

  TgwSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet1
      RouteTableId: !Ref TgwRouteTable

  TgwSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet2
      RouteTableId: !Ref TgwRouteTable

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "inspection-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  IngressRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref IngressRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

Outputs:
  VpcId:
    Description: "The ID of the VPC"
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  IngressSubnet1Cidr:
    Description: "CIDR block of ingress subnet in AZ A"
    Value: !Ref IngressSubnet1Cidr
    Export:
      Name: !Sub "${AWS::StackName}-IngressSubnet1Cidr"
  IngressSubnet2Cidr:
    Description: "CIDR block of ingress subnet in AZ B"
    Value: !Ref IngressSubnet2Cidr
    Export:
      Name: !Sub "${AWS::StackName}-IngressSubnet2Cidr"
  ProxySubnet1Cidr:
    Description: "CIDR block of proxy subnet in AZ A"
    Value: !Ref ProxySubnet1Cidr
    Export:
      Name: !Sub "${AWS::StackName}-ProxySubnet1Cidr"
  ProxySubnet2Cidr:
    Description: "CIDR block of proxy subnet in AZ B"
    Value: !Ref ProxySubnet2Cidr
    Export:
      Name: !Sub "${AWS::StackName}-ProxySubnet2Cidr"
  TgwSubnet1Cidr:
    Description: "CIDR block of TGW subnet in AZ A"
    Value: !Ref TgwSubnet1Cidr
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet1Cidr"
  TgwSubnet2Cidr:
    Description: "CIDR block of TGW subnet in AZ B"
    Value: !Ref TgwSubnet2Cidr
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet2Cidr"

