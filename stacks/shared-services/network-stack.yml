AWSTemplateFormatVersion: '2010-09-09'
Description: Shared services network stack

Parameters:
  VpcCidr:
    Type: String
    Description: "CIDR block of VPC"
    Default: 10.1.0.0/16
  ManagementSubnetCidr:
    Type: String
    Description: "CIDR block of management subnet"
    Default: 10.1.1.0/24
  PublicSubnetCidr:
    Type: String
    Description: "CIDR block of public subnet"
    Default: 10.1.2.0/24
  IngressSubnet1Cidr:
    Type: String
    Description: "CIDR block of ingress subnet in AZ A"
    Default: 10.1.10.0/24
  IngressSubnet2Cidr:
    Type: String
    Description: "CIDR block of ingress subnet in AZ B"
    Default: 10.1.11.0/24
  AppSubnet1Cidr:
    Type: String
    Description: "CIDR block of app subnet in AZ A"
    Default: 10.1.20.0/24
  AppSubnet2Cidr:
    Type: String
    Description: "CIDR block of app subnet in AZ B"
    Default: 10.1.21.0/24
  DataSubnet1Cidr:
    Type: String
    Description: "CIDR block of data subnet in AZ A"
    Default: 10.1.30.0/24
  DataSubnet2Cidr:
    Type: String
    Description: "CIDR block of data subnet in AZ B"
    Default: 10.1.31.0/24
  TgwSubnet1Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ A"
    Default: 10.1.40.0/24
  TgwSubnet2Cidr:
    Type: String
    Description: "CIDR block of TGW subnet in AZ B"
    Default: 10.1.41.0/24

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: "shared-services-vpc"

  ManagementSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref ManagementSubnetCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-management-subnet"

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-public-subnet"

  IngressSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref IngressSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-ingress-subnet-a"

  IngressSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref IngressSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-ingress-subnet-b"

  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref AppSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-app-subnet-a"

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref AppSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-app-subnet-b"

  DataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref DataSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-data-subnet-a"

  DataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref DataSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-data-subnet-b"

  TgwSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}a"
      CidrBlock: !Ref TgwSubnet1Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-tgw-subnet-a"

  TgwSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub "${AWS::Region}b"
      CidrBlock: !Ref TgwSubnet2Cidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-tgw-subnet-b"

  # Create custom route tables and explicitly associate subnets to
  # override the default route table.

  ManagementRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-management-rtb"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-public-rtb"

  IngressRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-ingress-rtb"

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-app-rtb"

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-data-rtb"

  TgwRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "shared-services-tgw-rtb"

  ManagementSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ManagementSubnet
      RouteTableId: !Ref ManagementRouteTable

  PublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  IngressSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IngressSubnet1
      RouteTableId: !Ref IngressRouteTable

  IngressSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IngressSubnet2
      RouteTableId: !Ref IngressRouteTable

  AppSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref AppRouteTable

  AppSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref AppRouteTable

  DataSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet1
      RouteTableId: !Ref DataRouteTable

  DataSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet2
      RouteTableId: !Ref DataRouteTable

  TgwSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet1
      RouteTableId: !Ref TgwRouteTable

  TgwSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref TgwSubnet2
      RouteTableId: !Ref TgwRouteTable

  InstanceConnectEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Shared services instance connect endpoint security group
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref VpcCidr
          Description: Allow SSH to hosts within VPC
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: shared-services-instance-connect-endpoint-sg

  InstanceConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      PreserveClientIp: false
      SecurityGroupIds:
        - !Ref InstanceConnectEndpointSecurityGroup
      SubnetId: !Ref ManagementSubnet
      Tags:
        - Key: Name
          Value: shared-services-eice

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "shared-services-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Provides public subnet with route to internet

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

Outputs:
  VpcId:
    Description: "The ID of the VPC"
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  ManagementSubnetId:
    Description: "The ID of the management subnet"
    Value: !Ref ManagementSubnet
    Export:
      Name: !Sub "${AWS::StackName}-ManagementSubnetId"
  PublicSubnetId:
    Description: "The ID of the public subnet"
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetId"
  IngressSubnet1Id:
    Description: "The ID of the ingress subnet in AZ A"
    Value: !Ref IngressSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-IngressSubnet1Id"
  IngressSubnet2Id:
    Description: "The ID of the ingress subnet in AZ B"
    Value: !Ref IngressSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-IngressSubnet2Id"
  AppSubnet1Id:
    Description: "The ID of the app subnet in AZ A"
    Value: !Ref AppSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnet1Id"
  AppSubnet2Id:
    Description: "The ID of the app subnet in AZ B"
    Value: !Ref AppSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnet2Id"
  DataSubnet1Id:
    Description: "The ID of the data subnet in AZ A"
    Value: !Ref DataSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-DataSubnet1Id"
  DataSubnet2Id:
    Description: "The ID of the data subnet in AZ B"
    Value: !Ref DataSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-DataSubnet2Id"
  TgwSubnet1Cidr:
    Description: "CIDR block of TGW subnet in AZ A"
    Value: !Ref TgwSubnet1Cidr
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet1Cidr"
  TgwSubnet2Cidr:
    Description: "CIDR block of TGW subnet in AZ B"
    Value: !Ref TgwSubnet2Cidr
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnet2Cidr"
  VpcCidr:
    Description: "CIDR block of VPC"
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"
  AppRouteTableId:
    Description: "The ID of the app route table"
    Value: !Ref AppRouteTable
    Export:
      Name: !Sub "${AWS::StackName}-AppRouteTableId"
  
  # Not sure if these are needed, just copied them over from prod
  
  # InstanceConnectEndpointSecurityGroupId:
  #   Description: "ID of instance connect endpoint security group"
  #   Value: !Ref InstanceConnectEndpointSecurityGroup
  #   Export:
  #     Name: !Sub "${AWS::StackName}-InstanceConnectEndpointSecurityGroupId"

