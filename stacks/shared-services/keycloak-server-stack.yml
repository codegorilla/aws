AWSTemplateFormatVersion: "2010-09-09"
Description: Keycloak server stack

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: "ID of AMI to use for keycloak server instance"
    Default: ami-0b77fd0a4e70d9ca6

Resources:

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Keycloak server security group
      VpcId: !ImportValue shared-services-stack-VpcId
      SecurityGroupIngress: []
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !ImportValue inspection-network-stack-InstanceConnectEndpointSecurityGroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic to anywhere
      Tags:
        - Key: Name
          Value: "keycloak-server-sg"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.small
      KeyName: svc.ansible
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet:
            - !Ref SecurityGroup
          SubnetId: !ImportValue shared-services-stack-AppSubnet1Id
      BlockDeviceMappings:
        - DeviceName: "/dev/sda1"
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: 20
      MetadataOptions:
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
        HttpTokens: required
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Install EC2 Instance Connect packages
          HOST="amazon-ec2-instance-connect-us-west-2.s3.us-west-2.amazonaws.com"
          PACKAGE1="ec2-instance-connect-2.0.0-5.rhel9.x86_64.rpm"
          PACKAGE2="ec2-instance-connect-selinux-2.0.0-5.noarch.rpm"
          mkdir /tmp/ec2-instance-connect
          curl https://${!HOST}/latest/linux_amd64/${!PACKAGE1} -o /tmp/ec2-instance-connect/ec2-instance-connect.rpm
          curl https://${!HOST}/latest/linux_amd64/${!PACKAGE2} -o /tmp/ec2-instance-connect/ec2-instance-connect-selinux.rpm
          dnf install -y /tmp/ec2-instance-connect/ec2-instance-connect.rpm
          dnf install -y /tmp/ec2-instance-connect/ec2-instance-connect-selinux.rpm
          # Install AWS CLI
          #curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          #dnf install -y unzip
          #unzip awscliv2.zip
          #sudo ./aws/install
      Tags:
        - Key: Name
          Value: "keycloak-server-instance"

