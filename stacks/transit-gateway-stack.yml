AWSTemplateFormatVersion: "2010-09-09"
Description: Transit gateway stack

Resources:

  # Transit gateway route table is automatically created because
  # default route table association and propagation are enabled.
  # However, note that by not explicitly creating it, we don't get
  # the transit gateway route table ID. That may be important in the
  # future.

  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: Main transit gateway
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      Tags:
        - Key: Name
          Value: main-tgw

Outputs:
  TransitGatewayId:
    Description: "The ID of the transit gateway"
    Value: !Ref TransitGateway
    Export:
      Name: !Sub '${AWS::StackName}-TransitGatewayId'
